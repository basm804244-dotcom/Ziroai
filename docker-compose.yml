version: '3.8'

# ═══════════════════════════════════════════════════════════════
# AetherAI Platform - Ultimate Edition 2026
# Full Docker Compose Stack
# ═══════════════════════════════════════════════════════════════

services:
  # ─── Infrastructure ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aether_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aether-network

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aether-network

  qdrant:
    image: qdrant/qdrant:v1.11
    container_name: aether-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    networks:
      - aether-network

  neo4j:
    image: neo4j:5.20-community
    container_name: aether-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aether_neo4j_2026}
      NEO4J_PLUGINS: '["apoc", "gds"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - aether-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.6
    container_name: aether-clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/monitoring/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - aether-network

  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: aether-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - aether-network

  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    container_name: aether-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-aether_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-aether_minio_secret_2026}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aether-network

  # ─── Monitoring ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aether-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - aether-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aether-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aether_grafana_2026}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - aether-network

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: aether-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - aether-network

  loki:
    image: grafana/loki:3.1.0
    container_name: aether-loki
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/loki/loki.yml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - aether-network

  # ─── AI Core ────────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:v0.5.1
    container_name: aether-vllm
    restart: unless-stopped
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    command: >
      --model meta-llama/Meta-Llama-3.1-8B-Instruct
      --tensor-parallel-size 1
      --max-model-len 8192
      --dtype half
    ports:
      - "8000:8000"
    networks:
      - aether-network
    profiles:
      - gpu

  ollama:
    image: ollama/ollama:0.2.5
    container_name: aether-ollama
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - aether-network
    profiles:
      - gpu

  # ─── API Gateway ────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: aether-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - API_GATEWAY_PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8001
      - CHAT_SERVICE_URL=http://chat-service:8002
      - AGENT_SERVICE_URL=http://agent-service:8003
      - MODEL_SERVICE_URL=http://model-service:8004
      - MEMORY_SERVICE_URL=http://memory-service:8005
      - RAG_SERVICE_URL=http://rag-service:8006
      - WORKSPACE_SERVICE_URL=http://workspace-service:8007
      - BILLING_SERVICE_URL=http://billing-service:8008
      - MCP_SERVICE_URL=http://mcp-service:8009
      - A2A_SERVICE_URL=http://a2a-service:8010
      - ANALYTICS_SERVICE_URL=http://analytics-service:8011
      - ADMIN_SERVICE_URL=http://admin-service:8012
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-100}
    depends_on:
      - redis
      - postgres
    networks:
      - aether-network

  # ─── Backend Services ───────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: aether-auth-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/1
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - aether-network

  chat-service:
    build:
      context: ./backend/chat-service
      dockerfile: Dockerfile
    container_name: aether-chat-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/2
      - MODEL_SERVICE_URL=http://model-service:8004
      - MEMORY_SERVICE_URL=http://memory-service:8005
    depends_on:
      - postgres
      - redis
    networks:
      - aether-network

  agent-service:
    build:
      context: ./backend/agent-service
      dockerfile: Dockerfile
    container_name: aether-agent-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8003
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/3
      - MODEL_SERVICE_URL=http://model-service:8004
      - MCP_SERVICE_URL=http://mcp-service:8009
      - A2A_SERVICE_URL=http://a2a-service:8010
      - MEMORY_SERVICE_URL=http://memory-service:8005
    depends_on:
      - postgres
      - redis
    networks:
      - aether-network

  model-service:
    build:
      context: ./backend/model-service
      dockerfile: Dockerfile
    container_name: aether-model-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8004
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/4
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - VLLM_HOST=${VLLM_HOST:-http://vllm:8000}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      - postgres
      - redis
    networks:
      - aether-network

  memory-service:
    build:
      context: ./backend/memory-service
      dockerfile: Dockerfile
    container_name: aether-memory-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8005
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/5
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-aether_neo4j_2026}
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
    networks:
      - aether-network

  rag-service:
    build:
      context: ./backend/rag-service
      dockerfile: Dockerfile
    container_name: aether-rag-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8006
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/6
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - aether-network

  workspace-service:
    build:
      context: ./backend/workspace-service
      dockerfile: Dockerfile
    container_name: aether-workspace-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8007
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/7
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-aether_minio}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-aether_minio_secret_2026}
      - MINIO_BUCKET=${MINIO_BUCKET:-aether-storage}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - aether-network

  billing-service:
    build:
      context: ./backend/billing-service
      dockerfile: Dockerfile
    container_name: aether-billing-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8008
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/8
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - aether-network

  mcp-service:
    build:
      context: ./backend/mcp-service
      dockerfile: Dockerfile
    container_name: aether-mcp-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8009
      - REDIS_URL=redis://redis:6379/9
    depends_on:
      - redis
    networks:
      - aether-network

  a2a-service:
    build:
      context: ./backend/a2a-service
      dockerfile: Dockerfile
    container_name: aether-a2a-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8010
      - REDIS_URL=redis://redis:6379/10
    depends_on:
      - redis
    networks:
      - aether-network

  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: aether-analytics-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8011
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - REDIS_URL=redis://redis:6379/11
    depends_on:
      - postgres
      - redis
      - clickhouse
    networks:
      - aether-network

  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    container_name: aether-admin-service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8012
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether_secret_2026}@postgres:5432/${POSTGRES_DB:-aether_platform}
      - REDIS_URL=redis://redis:6379/12
    depends_on:
      - postgres
      - redis
    networks:
      - aether-network

  # ─── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aether-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - NEXT_PUBLIC_STRIPE_KEY=${STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - aether-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  clickhouse_data:
  elasticsearch_data:
  minio_data:
  prometheus_data:
  grafana_data:
  ollama_data:

networks:
  aether-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
