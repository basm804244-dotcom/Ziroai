apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aether-network-policy
  namespace: aether
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: aether
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: aether
