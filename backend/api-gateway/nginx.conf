user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstreams
    upstream auth_backend {
        least_conn;
        server auth-service:8001 max_fails=3 fail_timeout=30s;
    }

    upstream chat_backend {
        least_conn;
        server chat-service:8002 max_fails=3 fail_timeout=30s;
    }

    upstream agent_backend {
        least_conn;
        server agent-service:8003 max_fails=3 fail_timeout=30s;
    }

    upstream model_backend {
        least_conn;
        server model-service:8004 max_fails=3 fail_timeout=30s;
    }

    upstream memory_backend {
        least_conn;
        server memory-service:8005 max_fails=3 fail_timeout=30s;
    }

    upstream rag_backend {
        least_conn;
        server rag-service:8006 max_fails=3 fail_timeout=30s;
    }

    upstream workspace_backend {
        least_conn;
        server workspace-service:8007 max_fails=3 fail_timeout=30s;
    }

    upstream billing_backend {
        least_conn;
        server billing-service:8008 max_fails=3 fail_timeout=30s;
    }

    upstream mcp_backend {
        least_conn;
        server mcp-service:8009 max_fails=3 fail_timeout=30s;
    }

    upstream a2a_backend {
        least_conn;
        server a2a-service:8010 max_fails=3 fail_timeout=30s;
    }

    upstream analytics_backend {
        least_conn;
        server analytics-service:8011 max_fails=3 fail_timeout=30s;
    }

    upstream admin_backend {
        least_conn;
        server admin-service:8012 max_fails=3 fail_timeout=30s;
    }

    # Main Server
    server {
        listen 8080;
        server_name _;

        # CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:;" always;

        # Health Check
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway","version":"2026.7.0"}';
            add_header Content-Type application/json;
        }

        # Auth Service
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://auth_backend/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Chat Service
        location /api/v1/chat/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://chat_backend/api/v1/chat/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket for Chat
        location /ws/chat/ {
            proxy_pass http://chat_backend/ws/chat/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Agent Service
        location /api/v1/agents/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://agent_backend/api/v1/agents/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Model Service
        location /api/v1/models/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://model_backend/api/v1/models/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Memory Service
        location /api/v1/memory/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://memory_backend/api/v1/memory/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # RAG Service
        location /api/v1/knowledge-bases/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://rag_backend/api/v1/knowledge-bases/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/search/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://rag_backend/api/v1/search/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Workspace Service
        location /api/v1/workspace/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://workspace_backend/api/v1/workspace/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Billing Service
        location /api/v1/billing/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://billing_backend/api/v1/billing/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP Service
        location /api/v1/mcp/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://mcp_backend/api/v1/mcp/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # A2A Service
        location /api/v1/a2a/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://a2a_backend/api/v1/a2a/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Analytics Service
        location /api/v1/analytics/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://analytics_backend/api/v1/analytics/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Service
        location /api/v1/admin/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://admin_backend/api/v1/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catch-all
        location / {
            return 404 '{"error":"Not Found","message":"The requested endpoint does not exist","documentation":"https://docs.aether.ai/api"}';
            add_header Content-Type application/json;
        }
    }
}
